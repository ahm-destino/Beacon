# render.yaml
# Render Blueprint (100% FREE TIER ONLY)
# Note: Render does not have free tiers for Background Workers or Cron Jobs.
# If you want to use those without paying, we will have to use external free tools like cron-job.org later!

services:
  # 1. Main Web API Service (Flask)
  - type: web
    name: beacon-api
    env: python
    region: frankfurt
    plan: free # Strictly Free Tier
    buildCommand: |
      pip install -r requirements.txt
      python add_pgvector_extension.py
      flask db upgrade
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 4 --threads 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        fromDatabase:
          name: beacon-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: beacon-cache
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: beacon-cache
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: beacon-cache
          property: connectionString
      - key: FLASK_DEBUG
        value: "0"
      - key: FLASK_APP
        value: "run.py"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

  # 2. Managed Redis Cache (Free Tier)
  - type: redis
    name: beacon-cache
    region: frankfurt
    plan: free # Strictly Free Tier
    ipAllowList: []

databases:
  # 3. Managed PostgreSQL Database (Free Tier)
  - name: beacon-db
    region: frankfurt
    plan: free # Strictly Free Tier

