# render.yaml
# Render Blueprint (Infrastructure as Code) - 100% Free Tier Compatible

services:
  # 1. Backend Web API Service (Flask)
  - type: web
    name: beacon-api
    env: python
    rootDir: beacon-backend
    region: virginia
    plan: free
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      # Essential setup on every start
      # 1. Create/Update tables first
      flask db upgrade
      
      # 2. Enable pgvector and add embedding column (requires table to exist)
      python add_pgvector_extension.py
      
      # 3. Auto-seed only if database is empty (checked inside script)
      python seed_from_json.py
      
      # 4. Start the servers
      bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        sync: false # User provides this in Render dashboard
      - key: REDIS_URL
        fromService:
          type: redis
          name: beacon-cache
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: beacon-cache
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: beacon-cache
          property: connectionString
      - key: FLASK_APP
        value: "run.py"
      - key: FLASK_DEBUG
        value: "0"
      
      # Security & Auth (Render generates these once)
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      
      # AI Services (User provides these manually)
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODELS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: AI_ANSWER_PROVIDER
        sync: false
      
      # 3rd Party Integrations (User provides these manually)
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      
      # AWS / Storage (User provides these manually)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_REGION
        sync: false

      # Platform Config (User provides these manually)
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # 2. Frontend Static Site Service (React/Vite)
  - type: web
    name: beacon-frontend
    runtime: static
    rootDir: beacon-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: "no-cache"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. Managed Redis Cache (Free Tier)
  - type: redis
    name: beacon-cache
    region: virginia
    plan: free
    ipAllowList: []
